name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
      fail-fast: false
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Odin
      uses: laytan/setup-odin@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        release: dev-2026-07

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12.2'    

    - name: Build ImGui
      run: cd thirdparty/imgui && python build.py

    - name: Build Box2D
      run: sh $(odin root)/vendor/box2d/build_box2d.sh

    - name: Run Script & Produce the zip
      run: |
        ./build.sh b rel
        mkdir bs_odin_${{ matrix.os }}
        mv bin/release/bs_odin/bs_odin bs_odin_${{ matrix.os }}/bs_odin
        mv res/ bs_odin_${{ matrix.os }}/res
        zip -r bs_odin_${{ matrix.os }}.zip bs_odin_${{ matrix.os }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          bs_odin_${{ matrix.os }}.zip
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
